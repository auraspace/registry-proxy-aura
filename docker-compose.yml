services:
  registry-proxy:
    image: "${REGISTRY_IMAGE:-ghcr.io/auraspace/registry-proxy-aura:latest}"
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${AURA_PROXY_PORT:-8080}:8080"
    environment:
      AURA_REGISTRY_ROOT: /data/registry
      AURA_REGISTRY_UPSTREAM: "${AURA_REGISTRY_UPSTREAM:-}"
    volumes:
      - registry-cache:/data/registry

volumes:
  registry-cache:
